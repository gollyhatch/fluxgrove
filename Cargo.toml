[package]
name = "fluxgrove"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A vim-flavoured terminal client for Miniflux"
readme = "README.md"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
html-escape = "0.3"
html2text = "0.17"
miniflux_api = "0.9"
opaline = { version = "0.4", features = ["builtin-themes", "ratatui"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
